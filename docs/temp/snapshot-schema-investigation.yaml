# Investigation: ProjectSnapshot Schema & Data Model
# Context bundle for understanding the canonical snapshot structure and validation rules

title: ProjectSnapshot Schema Investigation
goal: Document the complete ProjectSnapshot Zod schema, data model, ID handling, and semantic validation rules

# ============================================
# Key Files
# ============================================

keyFiles:
  schemaCore: packages/schema/src/core.ts:1-223
    - Main Zod schema definitions
    - All entity types (Quest, Chapter, Task, Reward)
    - UI state and metadata structures

  schemaDefaults: packages/schema/src/defaults.ts:1-71
    - Factory functions for creating default snapshots/chapters/quests
