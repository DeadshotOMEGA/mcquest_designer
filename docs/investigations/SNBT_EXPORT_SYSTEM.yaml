    - Result: files Map<string, string> → download as ZIP

  backend:
    - apps/web/src/app/api/export/route.ts (inferred) - API route for export
    - Receives ProjectSnapshot from request body
    - Calls compileSnapshot() from @mcquest/export
    - Returns ZIP file or error response

  sharedSchemas:
    - packages/schema/src/index.ts - barrel export
    - Used by apps/web (frontend validation) and packages/export (compiler input)
    - Contract: FE/BE must agree on ProjectSnapshot shape

  persistenceLayer:
    - Prisma JSONB column stores ProjectSnapshot (immutable per version)
    - Snapshot retrieved → validated → exported on demand
    - Immutability: versions are never mutated, only appended

