notes:
  SNBT_Syntax:
    - SNBT is Minecraft NBT text format (NOT JSON)
    - Keys are unquoted identifiers or quoted strings
    - Values: strings (quoted), numbers (int/long/float/double suffixes), lists, objects
    - No trailing commas
    - Comments not standard SNBT (some tools support // but not reliable)
    - Example: autofocus_id: "37F99696A47264FD" (string value)

  SNBT_Escaping:
    - Strings use double quotes
    - Backslash escapes: \\ for backslash, \" for quote
    - User text in descriptions/commands must be escaped

  RoundTripChallenge:
    - FTB Quests SNBT structure may have fields not in ProjectSnapshot schema
    - Example: images array in chapter (cosmetic overlay, not in our schema)
    - Decision: Capture enough for faithful re-export, drop cosmetics initially (can add later)
    - Risk: Round-trip may lose cosmetic data (images, custom colors, etc.)

  DeterminismGotchas:
    - Floating-point positions (x: 12.0d, y: -5.0d) may have precision loss
    - UUID ordering must be lexicographic (string compare, not numeric)
    - Dependency edge order affects SNBT line order (affects byte-for-byte comparison)
    - SNBT formatter: indent, space, newline consistency matters

  PerformanceNotes:
    - Golden export ftb_quests_example/quests/ is a large fixture (many chapters)
    - Round-trip test on large fixture may be slow
    - Consider micro-golden (few quests, one chapter) for unit tests
    - Full fixture for integration/regression tests

  SecuretyNotes:
    - Command rewards are user text → must escape for SNBT injection safety
    - Description text may contain arbitrary Unicode → escaping required
    - SNBT parsing: validate well-formed SNBT to prevent DoS (nested object depth)

