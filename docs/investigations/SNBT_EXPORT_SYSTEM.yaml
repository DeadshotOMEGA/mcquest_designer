# Investigation: SNBT Export System
# Round-trip requirements and architecture discovery

title: SNBT Export System - Compiler, Snapshot Transformation, and Determinism
goal: Understand the complete SNBT export pipeline, from ProjectSnapshot to packaged SNBT files, including deterministic requirements and round-trip validation constraints.

keyFiles:
  entryPoints:
    - packages/export/src/index.ts:25 - compileSnapshot() entry point (stub)
    - packages/export/src/index.test.ts:17 - Export test entry point

  coreLogic:
    - packages/schema/src/core.ts:1-223 - ProjectSnapshot, Chapter, Quest, Task, Reward schema definitions
    - packages/schema/src/defaults.ts:8-70 - createDefaultSnapshot(), createDefaultChapter(), createDefaultQuest()
    - packages/schema/src/validation/validator.ts:58-106 - validateSnapshot() semantic validation orchestrator
    - packages/schema/src/validation/rules.ts:1-466 - All validation rules (14 rules covering structure, graph integrity, circular dependencies)

  packageStructure:
    - packages/export/ - Export compiler package (0.1.0)
    - packages/schema/ - Shared snapshot schema (0.1.0)
    - ftb_quests_example/ - Real FTB Quests export fixture (benchmark for round-trip)
    - docs/platform_examples/reference_export/ - Generated reference exports (golden test fixtures)

testFixtures:
  goldenExports:
    - ftb_quests_example/quests/chapters/*.snbt - Real chapter SNBT files (benchmark data)
    - ftb_quests_example/quests/quests/*.snbt - Real quest SNBT files (not enumerated, assume exist)
    - docs/platform_examples/reference_export/config/ftbquests/quests/chapters/*.snbt - Generated reference chapters
    - docs/platform_examples/reference_export/config/ftbquests/quests/quests/*.snbt - Generated reference quests

  unitTests:
    - packages/export/src/index.test.ts:5-36 - Constants and stub compiler tests
    - packages/schema/src/validation/ - Validation rules tested elsewhere (inferred)

snbtStructure:
  chapterFile:
    location: config/ftbquests/quests/chapters/{filename}.snbt
    rootFields:
      - id: String (hex ID)
      - filename: String (kebab-case, matches file name)
      - autofocus_id: String (hex ID of focused quest)
      - group: String (hex ID, group/section identifier)
      - title: String (chapter name, inferred from example)
      - icon: Object (icon definition with ftbquests:custom_icon or item reference)
      - images: Array<Object> (decorative overlay images)
      - default_quest_shape: String (quest visual shape)
      - default_hide_dependency_lines: Boolean
      - default_min_width: Number
    example:
      - ftb_quests_example/quests/chapters/gearing_up.snbt:1-50 (shows icon, images, and structure)

  questFile:
    location: config/ftbquests/quests/quests/{filename}.snbt
    rootFields: (inferred from reference exports)
      - id: String (hex ID)
      - filename: String (kebab-case)
      - quest: String (internal quest ID within chapter)
      - title: String
      - description: String (multiline)
      - subtitle: String (optional)
      - rewards: Array (reward objects)
      - tasks: Array (task objects)
      - dependencies: Array (dependency objects)
      - x, y: Number (position in canvas)
      - size: Number (visual size)
      - shape: String (quest shape)
      - icon: Object
      - optional: Boolean
      - hidden: String ('true', 'false', or 'dependency')
      - repeatable: Boolean
      - hideUntilDeps: Boolean
      - canRepeat: Boolean

databaseModels:
  ProjectSnapshot:
    description: Top-level immutable snapshot storing all quest/chapter/dependency data
    fields:
      - version: string (schema version "0.1.0")
      - metadata: ProjectMetadata (name, MC version, timestamps)
      - chapters: Chapter[] (ordered by chapter.order)
      - quests: Quest[] (may span multiple chapters)
      - dependencies: Dependency[] (quest→quest edges)
      - uiState: UISnapshot (editor-only, NOT exported)

  Chapter:
    description: Quest grouping/progression container
    fields:
      - id: UUID (internal, unique)
      - title: string (required, min 1 char)
      - description: string (optional)
      - order: integer (determines export sort order, must be unique per validation rule)
      - icon: IconReference (optional)
      - background: string (optional, image reference)
      - defaultQuestShape: QuestShape (optional, applies to quests in chapter)

  Quest:
    description: Individual quest in a chapter
    fields:
      - id: UUID (matches React Flow node.id)
      - chapterId: UUID (foreign key to Chapter)
      - title: string (required, min 1 char)
      - subtitle: string (optional)
      - description: string (optional)
      - position: {x: number, y: number} (canvas position)
      - size: number (positive, default 1, affects visual size)
      - shape: QuestShape enum (square, rsquare, circle, diamond, pentagon, hexagon, octagon)
      - icon: IconReference (optional)
      - tasks: Task[] (what player must do)
      - rewards: Reward[] (what player gets)
      - settings: QuestSettings (optional, hidden, repeatable, etc.)

  Task:
    description: Individual objective within a quest
    fields:
      - id: UUID
      - type: TaskType enum (item, checkmark, advancement, kill, location, observation, xp, stat)
      - title: string (optional)
      - count: integer (positive, default 1)
      - type-specific: item, advancementId, entityType, dimension, position, range (optional depending on type)

  Reward:
    description: Individual reward for completing a quest
    fields:
      - id: UUID
      - type: RewardType enum (item, command, xp, xp_levels, choice, random, loot)
      - title: string (optional)
      - count: integer (positive, default 1)
      - type-specific: item, command, xp, levels, table (optional depending on type)

  Dependency:
    description: Quest→Quest completion prerequisite edge
    fields:
      - fromQuestId: UUID (must be completed first)
      - toQuestId: UUID (unlocks after fromQuestId complete)
      - type: DependencyType enum ('AND' or 'OR', default 'AND')

  UISnapshot:
    description: Editor UI state (NOT persisted to export)
    fields:
      - activeChapterId: UUID (optional, currently selected chapter)
      - viewportByChapter: {[chapterId]: ViewportState} (zoom, pan per chapter)
      - selectedQuestId: UUID (optional, currently selected quest)

dataFlow:
  parsing:
    - 1. Input snapshot JSON → packages/schema/src/core.ts → ProjectSnapshotSchema.parse()
    - 2. Zod validates structure (types, required fields, ranges)

  validation:
    - 3. packages/schema/src/validation/validator.ts:validateSnapshot() → runs all 14 rules
    - 4. Rules check: unique IDs, chapter references, circular dependencies, orphan quests (rules.ts:1-466)
    - 5. Output: ValidationResult with problems[] (errors block export, warnings are informational)

  transformation:
    - 6. ProjectSnapshot → ExportModel (stub in packages/export/src/index.ts:25)
    - 7. Chapter sort by chapter.order (determinism requirement)
    - 8. Quest sort by (chapter.order, quest.position.y, quest.position.x, quest.id) (stable order)
    - 9. Dependency sort by (fromQuestId, toQuestId) for consistency
    - 10. ID mapping: UUID → FTB hex ID (deterministic, derived from sorted position, not insertion order)

  emission:
    - 11. ExportModel → SNBT emitter (stub, to be implemented)
    - 12. For each chapter: generate config/ftbquests/quests/chapters/{filename}.snbt
    - 13. For each quest: generate config/ftbquests/quests/quests/{filename}.snbt
    - 14. Write SNBT with escaped strings, proper nesting, hex ID formatting

  packaging:
    - 15. All SNBT files → ZIP archive
    - 16. Folder structure: config/ftbquests/quests/chapters/, quests/, lang/ (optional)

determinismRequirements:
  sortingOrder:
    - Chapters: sorted by chapter.order ascending (must be unique per validation rule)
    - Quests within chapter: sorted by (chapter.order, quest.position.y, quest.position.x, quest.id UUID)
    - Dependencies: sorted by (fromQuestId, toQuestId) for consistent SNBT ordering
    - Reasoning: Same snapshot ⇒ same export outputs (byte-identical if normalized)

  idMapping:
    - Internal: UUIDs (v4) for all entities
    - Export: FTB Quests expects hex IDs in SNBT
    - Strategy: Map UUID → deterministic hex ID derived from sorted position
    - Constraint: ID mapping must be reversible for round-trip (snapshot → export → re-import → snapshot)
    - Current state: Mapping strategy not yet implemented in packages/export

  stringEscaping:
    - SNBT strings must escape quotes and backslashes
    - Multiline descriptions must be properly quoted
    - Command reward strings must be escaped to prevent SNBT injection

  fileNaming:
    - Filenames in SNBT filename: field must match actual .snbt file basename
    - Use kebab-case for consistency
    - Example: gearing_up.snbt has filename: "gearing_up"

versionTargeting:
  supportedVersions:
    - Exported constant: packages/export/src/index.ts:11 - ['1.21', '1.21.1']
    - Schema constant: packages/schema/src/core.ts:195 - ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4']

  targetMinecraftVersion:
    - ProjectMetadata.targetMinecraftVersion: string (default '1.21.1')
    - Determines SNBT schema version and available task/reward types
    - Export should validate snapshot against target version constraints

  futureVersioning:
    - If MC version changes SNBT format, isolate version-specific mapping in functions
    - Example: MC 1.22 task types might differ from 1.21 → version-specific transform
    - Test with golden exports per MC version

validationRules:
  questValidation:
    - validateUniqueQuestIds: Rules 1
    - validateQuestTitles: Rules 2 (error: quest must have title)
    - validateQuestChapterReferences: Rules 3 (error: quest.chapterId must exist)

  chapterValidation:
    - validateUniqueChapterIds: Rules 1
    - validateChapterTitles: Rules 1 (error: chapter must have title)
    - validateUniqueChapterOrder: Rules 1 (warning: chapter.order should be unique)

  dependencyValidation:
    - validateDependencySourceExists: Rules 1 (error: fromQuestId must exist)
    - validateDependencyTargetExists: Rules 1 (error: toQuestId must exist)
    - validateNoSelfDependencies: Rules 1 (error: quest cannot depend on itself)
    - validateNoDuplicateDependencies: Rules 1 (warning: duplicate edges)
    - validateNoCircularDependencies: Rules 1 (error: Kahn's algorithm, detects all cycles)
    - validateCrossChapterDependencies: Rules 1 (warning: dependency spans chapters)

  orphanDetection:
    - validateOrphanQuests: Rules 1 (warning: quest with no incoming/outgoing edges, unless single quest)

  blockingVsWarning:
    - Errors: validation fails, export cannot proceed
    - Warnings: export can proceed but may have design issues
    - Export flow: Check errors, log warnings, proceed if no errors

roundTripRequirements:
  import:
    - User uploads SNBT questbook (Minecraft export)
    - Parser reads SNBT → intermediate format
    - Inferred constraint: Must preserve all SNBT fields for faithful round-trip

  internalRepresentation:
    - ProjectSnapshot captures all quest/chapter/dependency structure
    - Preserves UUIDs, positions, settings, tasks, rewards
    - Does NOT capture SNBT-specific formatting (escaping, comment placement)

  export:
    - ProjectSnapshot → SNBT files (packages/export compiler)
    - Must produce valid FTB Quests SNBT readable by Minecraft
    - Deterministic: same snapshot → same SNBT byte-for-byte (after normalization)

  reimport:
    - Generated SNBT → re-parsed → new ProjectSnapshot
    - Constraint: Re-imported snapshot should have equivalent semantics
    - ID mapping: UUID internal IDs stable, hex IDs may change due to sorting
    - Test: Compare original snapshot with re-imported snapshot (semantic equivalence)

  constraintList:
    1. Preserve all chapter/quest/task/reward fields
    2. Preserve dependency edges and types (AND/OR)
    3. Preserve quest positions and visual properties
    4. Generate deterministic output (same snapshot → same bytes)
    5. Escape SNBT strings safely (no injection vulnerabilities)
    6. Use version-correct task/reward types for target MC version
    7. Validate before export (reject circular deps, missing chapters, duplicate IDs)
    8. Support future version migrations (1.21 → 1.22 without breaking 1.21 exports)

